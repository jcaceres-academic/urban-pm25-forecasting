project:
  type: website
  output-dir: docs

website:
  title: "Urban PM2.5 Prophet-LSTM"
  site-url: https://jcaceres-academic.github.io/urban-pm25-prophet-lstm/
  description: "Reproducible analysis and forecasting of urban PM2.5 in Madrid using CRISP-DM and hybrid Prophet-LSTM models."
  page-navigation: true
  search: false

  navbar:
    background: "#7A0026"
    pinned: true
    title: false

    left:
      - icon: mortarboard-fill
        text: "Academic Home"
        href: https://jcaceres-academic.github.io/
        target: "_self"

    right:
      - icon: house
        text: "Home"
        href: index.html
        target: "_self"

      - icon: file-earmark-text
        text: "Article"
        href: https://doi.org/10.3390/appliedmath4040076
        target: "_blank"

      - icon: laptop
        text: "Notebook"
        href: notebook.html
        target: "_self"

      - icon: code-slash
        text: "Scripts"
        href: scripts.html
        target: "_self"

      - icon: github
        text: "GitHub"
        href: https://github.com/jcaceres-academic/urban-pm25-prophet-lstm
        target: "_blank"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "On this page"
    toc-depth: 2
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    number-sections: false
    lang: en
    html-math-method: mathjax

editor: visual
